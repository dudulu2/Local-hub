<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0c">
  <title>LocalHub · 本地媒体库</title>
  <link rel="stylesheet" href="/smart_ui.css">
  <link rel="stylesheet" href="/ux_enhancements.css">
  <link rel="stylesheet" href="/v23_features.css">
  <link rel="stylesheet" href="/v23_player_fix.css">
  <style>
    .reader{width:min(1240px,96vw);height:min(92vh,900px);max-width:96vw;max-height:94vh;transition:width .12s ease,height .12s ease}.reader-stage{height:calc(100% - 52px);min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#050506}.reader-stage img{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;object-position:center;transition:opacity .12s ease}.reader.reader-long .reader-stage{overflow-y:auto;overflow-x:hidden;align-items:flex-start;justify-content:center;scrollbar-gutter:stable}.reader.reader-long .reader-stage img{width:100%;height:auto;max-width:100%;max-height:none;object-fit:unset}.reader.reader-loading .reader-stage::after{content:'读取图片…';color:#666;font-size:12px}.reader.reader-loading .reader-stage img{opacity:0}@media(max-width:700px){.reader{max-width:100vw;max-height:100vh;border-radius:0}.reader.reader-long{width:100vw!important;height:100vh!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brandBtn"><b>LOCAL</b><strong>HUB</strong></button>
    <div class="search"><input id="searchInput" type="search" placeholder="搜索文件名、文件夹或标签…" autocomplete="off"><button id="clearSearch">×</button></div>
    <button class="top-btn" id="rescanBtn">重新扫描</button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="main-nav">
        <button data-route="home" class="active"><span>⌂</span>首页</button>
        <button data-route="videos"><span>▶</span>全部视频</button>
        <button data-route="packs"><span>▦</span>图包 / 图册</button>
        <button data-route="root"><span>◫</span>根目录</button>
        <button data-route="favorite"><span>★</span>收藏</button>
        <button data-route="continue"><span>↺</span>继续观看</button>
      </nav>
      <div class="side-title">文件夹</div>
      <div id="folderNav" class="folder-nav"><div class="side-loading">正在建立索引…</div></div>
      <div class="side-foot">轻量索引 · 按需预览 · 本机运行</div>
    </aside>

    <main class="content">
      <section class="heading">
        <div><h1 id="pageTitle">首页</h1><p id="pageMeta">只展示少量内容，完整媒体库通过左侧分类进入。</p></div>
        <div id="viewHint" class="view-hint"></div>
      </section>
      <section id="grid" class="grid"></section>
      <div id="empty" class="empty hidden"><b>没有找到内容</b><span>换一个分类、文件夹或搜索词试试。</span></div>
      <nav id="pager" class="pager hidden" aria-label="分页">
        <button id="prevPage">‹ 上一页</button>
        <span id="pageInfo">第 1 页</span>
        <button id="nextPage">下一页 ›</button>
      </nav>
    </main>
  </div>

  <dialog id="viewer" class="viewer">
    <button class="dialog-close" id="closeViewer" aria-label="关闭">×</button>
    <div class="player-shell" id="playerShell">
      <div class="viewer-stage" id="viewerStage">
        <video id="videoPlayer" playsinline preload="metadata"></video>
        <div id="playerNotice" class="player-notice hidden">
          <strong id="playerNoticeTitle">正在准备播放</strong>
          <span id="playerNoticeText"></span>
          <div id="compatProgress" class="compat-progress hidden"><i></i></div>
        </div>
      </div>
      <div class="player-controls">
        <button id="playBtn" class="control-icon" aria-label="播放">▶</button>
        <span id="currentTime" class="time-text">0:00</span>
        <input id="seekBar" class="seek-bar" type="range" min="0" max="1000" step="1" value="0" aria-label="播放进度">
        <span id="durationTime" class="time-text">0:00</span>
        <button id="muteBtn" class="control-icon small" aria-label="静音">🔊</button>
        <input id="volumeBar" class="volume-bar" type="range" min="0" max="1" step="0.05" value="1" aria-label="音量">
        <select id="speedSelect" class="speed-select" aria-label="倍速">
          <option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
        <button id="compatBtn" class="control-text">兼容播放</button>
        <button id="systemPlayerBtn" class="control-text">系统播放器</button>
        <button id="fullscreenBtn" class="control-icon small" aria-label="全屏">⛶</button>
      </div>
    </div>

    <div class="viewer-info">
      <div class="viewer-copy">
        <div class="viewer-title-row"><h2 id="viewerTitle"></h2><span id="playMode" class="mode-pill">原生</span></div>
        <p id="viewerPath"></p>
        <div id="mediaDiagnostics" class="media-diagnostics">正在读取媒体信息…</div>
        <div id="viewerTagStrip" class="viewer-tag-strip"></div>
      </div>
      <div class="viewer-actions"><button id="favoriteBtn">☆ 收藏</button><button id="manageBtn">整理</button></div>
    </div>

    <aside id="managePanel" class="manage-panel hidden">
      <div><b>标签</b><input id="manageTags" placeholder="多个标签用逗号分隔"></div>
      <button id="saveTags">保存标签</button>
      <div><b>改名</b><input id="renameInput" placeholder="新文件名（不含扩展名）"></div>
      <button id="renameBtn">应用新名称</button>
      <div><b>移动到文件夹</b><input id="moveInput" placeholder="例如：收藏/人物"></div>
      <button id="moveBtn">移动文件</button>
    </aside>
  </dialog>

  <dialog id="reader" class="reader">
    <button class="dialog-close" id="closeReader">×</button>
    <button class="reader-nav prev" id="readerPrev">‹</button>
    <div class="reader-stage"><img id="readerImage" alt=""></div>
    <button class="reader-nav next" id="readerNext">›</button>
    <footer><strong id="readerTitle"></strong><span id="readerCounter"></span></footer>
  </dialog>

  <dialog id="tagDialog" class="tag-dialog">
    <form method="dialog" onsubmit="return false">
      <header><strong>快速调整标签</strong><button id="closeTagDialog" type="button">×</button></header>
      <p id="tagDialogName"></p>
      <input id="tagDialogInput" placeholder="例如：人物, 室内, 收藏">
      <div class="tag-dialog-actions"><button id="cancelTagDialog" type="button">取消</button><button id="saveTagDialog" class="primary" type="button">保存</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="/smart_ui.js"></script>
  <script src="/ux_enhancements.js"></script>
  <script>
    // LocalHub 2.3.1 bootstrap guard: v23_features replaces the rescan label with
    // an SVG icon. Its observer only needs the disabled state; observing its own
    // childList makes innerHTML changes recursively schedule more callbacks.
    (()=>{const Native=window.MutationObserver;if(!Native)return;window.MutationObserver=class LocalHubMutationObserver extends Native{observe(target,options={}){if(target?.id==='rescanBtn'&&Array.isArray(options?.attributeFilter)&&options.attributeFilter.includes('disabled')){return super.observe(target,{attributes:true,attributeFilter:['disabled']});}return super.observe(target,options);}}})();
  </script>
  <script src="/v23_features.js"></script>
  <script src="/v23_player_fix.js"></script>
  <script>
    (()=>{const reader=document.querySelector('#reader'),stage=document.querySelector('.reader-stage'),image=document.querySelector('#readerImage');if(!reader||!stage||!image)return;const FOOTER=52,LONG=2.35;function fit(){const nw=image.naturalWidth||0,nh=image.naturalHeight||0;if(!nw||!nh)return;reader.classList.remove('reader-loading');const vw=Math.max(360,innerWidth*.96),vh=Math.max(320,innerHeight*.94),ratio=nw/nh;if(nh/nw>=LONG){reader.classList.add('reader-long');const w=Math.min(vw,Math.max(420,Math.min(nw,980)));reader.style.width=`${Math.round(w)}px`;reader.style.height=`${Math.round(vh)}px`;requestAnimationFrame(()=>stage.scrollTop=0);return}reader.classList.remove('reader-long');const ah=Math.max(220,vh-FOOTER);let scale=Math.min(vw/nw,ah/nh,1.35);if(!Number.isFinite(scale)||scale<=0)scale=1;const dw=Math.max(360,Math.min(vw,nw*scale)),dh=Math.max(220,Math.min(ah,nh*scale));let dialogW=dw,dialogH=dh+FOOTER;const expected=dh*ratio;if(expected>0&&expected<vw)dialogW=Math.max(360,expected);reader.style.width=`${Math.round(Math.min(vw,dialogW))}px`;reader.style.height=`${Math.round(Math.min(vh,dialogH))}px`;stage.scrollTop=0}new MutationObserver(()=>{reader.classList.add('reader-loading');reader.classList.remove('reader-long');stage.scrollTop=0}).observe(image,{attributes:true,attributeFilter:['src']});image.addEventListener('load',fit);image.addEventListener('error',()=>reader.classList.remove('reader-loading'));addEventListener('resize',()=>{if(reader.open&&image.complete&&image.naturalWidth)fit()});reader.addEventListener('close',()=>{reader.classList.remove('reader-long','reader-loading');reader.style.removeProperty('width');reader.style.removeProperty('height');stage.scrollTop=0})})();
  </script>
</body>
</html>
