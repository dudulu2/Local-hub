name: Alpha5 Windows validation

on:
  pull_request:
    branches: [ci/2.2.4-alpha5-build-base]

permissions:
  contents: read

jobs:
  validate-alpha5:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller pystray pillow imageio-ffmpeg comtypes
      - name: Validate sources
        shell: pwsh
        run: |
          python -m py_compile launcher.py server.py smart_mode.py smart_thumbnail.py preview_support.py playback_priority.py io_scheduler.py media_probe.py compat_support.py rating_support.py recommendation_support.py catalog_cache.py tools/smoke_recommendations.py tools/smoke_exact_fit.py tools/smoke_release.py
          node --check .\smart_ui.js
          node --check .\ux_enhancements.js
          node --check .\move_branding.js
          node --check .\recommendation_ui.js
      - name: Release metadata smoke test
        run: python tools/smoke_release.py
      - name: Recommendation isolation smoke test
        run: python tools/smoke_recommendations.py
      - name: Unified exact-fit smoke test
        run: python tools/smoke_exact_fit.py
      - name: Playback priority smoke test
        run: python tools/smoke_playback_priority.py
      - name: Media compatibility smoke test
        run: python tools/smoke_compat.py
      - name: Preview smoke test
        run: python tools/smoke_preview.py
      - name: Launcher smoke test
        run: python tools/smoke_launcher.py
      - name: Generate icon
        run: python tools/make_icon.py
      - name: Build one-file executable
        run: pyinstaller --noconfirm --clean LocalHub.spec
      - name: Packaged EXE self-test
        shell: pwsh
        run: |
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:ALL_PROXY = 'http://127.0.0.1:9'
          $env:NO_PROXY = ''
          $p = Start-Process -FilePath .\dist\LocalHub.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged LocalHub self-test failed: $($p.ExitCode)" }
      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\LocalHub.exe -Algorithm SHA256).Hash.ToLower()
          "LocalHub.exe  $hash" | Set-Content .\dist\SHA256.txt -Encoding utf8
          Write-Host "SHA256: $hash"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: LocalHub-Windows-x64
          path: |
            dist/LocalHub.exe
            dist/SHA256.txt
          if-no-files-found: error
          compression-level: 0
