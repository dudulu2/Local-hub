name: Apply viewer navigation hotfix

on:
  push:
    branches: [fix/tray-lifecycle-2.4.1]
    paths:
      - '.github/workflows/assistant-viewer-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tray-lifecycle-2.4.1
          fetch-depth: 0
      - name: Apply compatibility-safe viewer fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          nav_path = Path('v23_features.js')
          nav = nav_path.read_text('utf-8')
          marker = 'LH_RECOMMEND_NAVIGATION_FIX_V2'
          if marker not in nav:
              nav += r'''

// LH_RECOMMEND_NAVIGATION_FIX_V2
(() => {
  'use strict';

  const viewer = document.querySelector('#viewer');
  const pathNode = document.querySelector('#viewerPath');
  const search = document.querySelector('#searchInput');
  const closeButton = document.querySelector('#closeViewer');
  const toastNode = document.querySelector('#toast');
  if (!viewer || !pathNode || !search || !closeButton) return;

  const history = [];
  let internalNavigation = false;
  let navigatingBack = false;

  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  function toast(message) {
    if (!toastNode || !message) return;
    toastNode.textContent = message;
    toastNode.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => toastNode.classList.remove('show'), 2100);
  }

  async function api(url) {
    const response = await fetch(url, {cache:'no-store'});
    let data = {};
    try { data = await response.json(); } catch {}
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }

  function snapshotView() {
    return {
      folder: document.querySelector('.folder-nav button.active')?.dataset.folder ?? null,
      route: document.querySelector('.main-nav button.active')?.dataset.route || '',
      query: (search.value || '').trim(),
    };
  }

  function restoreBackground(view) {
    if (!view) return;
    if (view.folder != null) {
      const direct = [...document.querySelectorAll('.folder-nav button')].find(node => node.dataset.folder === view.folder);
      direct?.click();
      return;
    }
    if (view.query) {
      search.value = view.query;
      search.dispatchEvent(new Event('input', {bubbles:true}));
      return;
    }
    if (view.route) {
      document.querySelector(`.main-nav button[data-route="${CSS.escape(view.route)}"]`)?.click();
    }
  }

  async function itemById(id) {
    if (!id) return null;
    const data = await api(`/api/smart/by-ids?ids=${encodeURIComponent(id)}`);
    return (data.items || []).find(item => item.id === id) || (data.items || [])[0] || null;
  }

  function updateBackButton() {
    let button = document.querySelector('#viewerHistoryBack');
    if (!button) {
      button = document.createElement('button');
      button.id = 'viewerHistoryBack';
      button.type = 'button';
      button.className = 'lh-viewer-history-back';
      button.setAttribute('aria-label', '返回上一个视频');
      button.title = '返回上一个视频';
      button.textContent = '←';
      viewer.appendChild(button);
      button.addEventListener('click', async event => {
        event.preventDefault();
        event.stopPropagation();
        const previous = history.pop();
        updateBackButton();
        if (!previous) return;
        try {
          const item = await itemById(previous);
          if (!item) throw new Error('上一个视频已不存在');
          navigatingBack = true;
          await openExactItem(item, {recordHistory:false});
        } catch (error) {
          toast(error.message || '无法返回上一个视频');
        } finally {
          navigatingBack = false;
          updateBackButton();
        }
      });
    }
    button.classList.toggle('hidden', history.length === 0);
  }

  if (!document.querySelector('#lhViewerNavigationStyle')) {
    const style = document.createElement('style');
    style.id = 'lhViewerNavigationStyle';
    style.textContent = `
      .lh-viewer-history-back{position:absolute;left:12px;top:12px;z-index:40;width:40px;height:40px;border:1px solid #35353a;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.28)}
      .lh-viewer-history-back:hover{background:#202024;border-color:#55555c}
      .lh-viewer-history-back.hidden{display:none!important}
    `;
    document.head.appendChild(style);
  }
  updateBackButton();

  async function waitForExactCard(id, timeout = 4600) {
    const deadline = Date.now() + timeout;
    while (Date.now() < deadline) {
      const card = [...document.querySelectorAll('.card[data-id]')].find(node => node.dataset.id === id);
      if (card) return card;
      await sleep(80);
    }
    return null;
  }

  async function openExactItem(item, {recordHistory=true} = {}) {
    const targetId = String(item?.id || '');
    if (!targetId) throw new Error('推荐视频路径无效');
    const currentId = (pathNode.textContent || '').trim();
    if (recordHistory && currentId && currentId !== targetId && !navigatingBack) {
      if (history[history.length - 1] !== currentId) history.push(currentId);
      if (history.length > 40) history.splice(0, history.length - 40);
      updateBackButton();
    }

    const background = snapshotView();
    internalNavigation = true;
    closeButton.click();
    await sleep(55);

    // Search by filename/stem, never by the full relative path. The smart search
    // index stores filename + folder + tags, while a slash-containing id is not
    // guaranteed to exist as one contiguous searchable string.
    const queries = [item.name, item.stem, String(item.name || '').replace(/\.[^.]+$/, '')]
      .map(value => String(value || '').trim())
      .filter((value, index, rows) => value && rows.indexOf(value) === index);

    let card = null;
    for (const query of queries) {
      search.value = query;
      search.dispatchEvent(new Event('input', {bubbles:true}));
      card = await waitForExactCard(targetId, 2600);
      if (card) break;
    }

    if (!card) {
      internalNavigation = false;
      restoreBackground(background);
      throw new Error('推荐视频存在，但当前列表没有定位到它');
    }

    card.click();
    const deadline = Date.now() + 2600;
    while (Date.now() < deadline) {
      if (viewer.open && (pathNode.textContent || '').trim() === targetId) break;
      await sleep(60);
    }
    viewer.scrollTop = 0;
    setTimeout(() => restoreBackground(background), 120);
    internalNavigation = false;
    updateBackButton();
  }

  // Capture before the old recommendation card listener. The legacy handler
  // searches by item.id and can leave the user on an empty result page.
  document.addEventListener('click', async event => {
    const card = event.target.closest?.('.v23-rec-card[data-rec-id]');
    if (!card) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    try {
      const item = await itemById(card.dataset.recId || '');
      if (!item) throw new Error('推荐视频已不存在');
      await openExactItem(item, {recordHistory:true});
    } catch (error) {
      internalNavigation = false;
      toast(error.message || '暂时无法打开推荐视频');
    }
  }, true);

  viewer.addEventListener('close', () => {
    if (internalNavigation) return;
    history.length = 0;
    updateBackButton();
  });
})();
'''
              nav_path.write_text(nav, 'utf-8')

          portrait_path = Path('playback_stability.js')
          portrait = portrait_path.read_text('utf-8')
          portrait_marker = 'LH_PORTRAIT_HARD_FIT_V2'
          if portrait_marker not in portrait:
              portrait += r'''

// LH_PORTRAIT_HARD_FIT_V2
(() => {
  'use strict';
  const viewer = document.querySelector('#viewer');
  const stage = document.querySelector('#viewerStage');
  const video = document.querySelector('#videoPlayer');
  const diagnostics = document.querySelector('#mediaDiagnostics');
  const pathNode = document.querySelector('#viewerPath');
  if (!viewer || !stage || !video || !pathNode) return;

  let hardApplied = false;
  let scheduled = 0;

  function diagnosticGeometry() {
    const text = (diagnostics?.textContent || '').trim();
    const match = text.match(/(\d{2,5})\s*[×x]\s*(\d{2,5})/i);
    if (!match) return null;
    const width = Number(match[1]) || 0;
    const height = Number(match[2]) || 0;
    return width && height ? {width, height} : null;
  }

  function intrinsicGeometry() {
    const width = Number(video.videoWidth) || 0;
    const height = Number(video.videoHeight) || 0;
    return width && height ? {width, height} : null;
  }

  function clearHardFit() {
    if (!hardApplied) return;
    hardApplied = false;
    stage.classList.remove('lh-hard-portrait');
    for (const prop of ['position','left','top','transform','margin','min-width','min-height']) video.style.removeProperty(prop);
    video.style.removeProperty('width');
    video.style.removeProperty('height');
    video.style.removeProperty('max-width');
    video.style.removeProperty('max-height');
    video.style.removeProperty('aspect-ratio');
    video.style.removeProperty('object-fit');
    video.style.removeProperty('object-position');
  }

  function applyHardPortrait() {
    scheduled = 0;
    if (!viewer.open) return;
    const diagnostic = diagnosticGeometry();
    const intrinsic = intrinsicGeometry();
    // The probe's displayed dimensions win. This is especially important for
    // phone videos whose rotation/display metadata can disagree with coded size.
    const g = diagnostic || intrinsic;
    if (!g || g.height <= g.width * 1.08) return;

    const widthAvailable = Math.max(1, stage.clientWidth || 0);
    const heightAvailable = Math.max(1, stage.clientHeight || 0);
    if (widthAvailable <= 1 || heightAvailable <= 1) return;

    const scale = Math.min(widthAvailable / g.width, heightAvailable / g.height);
    if (!Number.isFinite(scale) || scale <= 0) return;
    const fittedWidth = Math.max(1, Math.floor(g.width * scale));
    const fittedHeight = Math.max(1, Math.floor(g.height * scale));

    hardApplied = true;
    stage.classList.add('lh-hard-portrait');
    stage.style.setProperty('position', 'relative', 'important');
    stage.style.setProperty('overflow', 'hidden', 'important');
    video.style.setProperty('position', 'absolute', 'important');
    video.style.setProperty('left', '50%', 'important');
    video.style.setProperty('top', '50%', 'important');
    video.style.setProperty('transform', 'translate(-50%, -50%)', 'important');
    video.style.setProperty('margin', '0', 'important');
    video.style.setProperty('min-width', '0', 'important');
    video.style.setProperty('min-height', '0', 'important');
    video.style.setProperty('width', `${fittedWidth}px`, 'important');
    video.style.setProperty('height', `${fittedHeight}px`, 'important');
    video.style.setProperty('max-width', 'none', 'important');
    video.style.setProperty('max-height', 'none', 'important');
    video.style.setProperty('aspect-ratio', `${g.width} / ${g.height}`, 'important');
    video.style.setProperty('object-fit', 'contain', 'important');
    video.style.setProperty('object-position', 'center center', 'important');
    stage.dataset.lhPortraitFit = `${g.width}x${g.height}:${fittedWidth}x${fittedHeight}`;
  }

  function scheduleFit() {
    if (scheduled) cancelAnimationFrame(scheduled);
    scheduled = requestAnimationFrame(() => {
      requestAnimationFrame(applyHardPortrait);
      setTimeout(applyHardPortrait, 80);
      setTimeout(applyHardPortrait, 260);
    });
  }

  video.addEventListener('loadedmetadata', scheduleFit);
  video.addEventListener('loadeddata', scheduleFit);
  video.addEventListener('resize', scheduleFit);
  viewer.addEventListener('toggle', scheduleFit);

  if (diagnostics) {
    new MutationObserver(scheduleFit).observe(diagnostics, {subtree:true, childList:true, characterData:true});
  }
  new MutationObserver(() => {
    clearHardFit();
    delete stage.dataset.lhPortraitFit;
    scheduleFit();
  }).observe(pathNode, {subtree:true, childList:true, characterData:true});

  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(scheduleFit).observe(stage);
  else window.addEventListener('resize', scheduleFit);

  viewer.addEventListener('close', () => {
    clearHardFit();
    delete stage.dataset.lhPortraitFit;
  });
})();
'''
              portrait_path.write_text(portrait, 'utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v23_features.js playback_stability.js
          if git diff --cached --quiet; then
            echo 'No patch needed'
          else
            git commit -m 'fix: reliable recommendation navigation and portrait fit'
            git push origin HEAD:fix/tray-lifecycle-2.4.1
          fi
