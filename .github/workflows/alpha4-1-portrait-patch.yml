name: Apply alpha4.1 portrait probe patch

on:
  push:
    branches: [agent/2.2.4-alpha4.1-portrait-probe]
    paths: ['.github/workflows/alpha4-1-portrait-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/2.2.4-alpha4.1-portrait-probe
      - name: Patch portrait detection and viewer layout
        shell: python
        run: |
          from pathlib import Path

          js_path = Path('ux_enhancements.js')
          js = js_path.read_text(encoding='utf-8')
          old = r'''  function installPortraitFit() {
    const video=$('#videoPlayer'),stage=$('#viewerStage'),viewer=$('#viewer');
    if(!video||!stage)return;
    const clear=()=>stage.classList.remove('lh-video-portrait','lh-video-landscape');
    const fit=()=>{
      const w=Number(video.videoWidth)||0,h=Number(video.videoHeight)||0;
      if(!w||!h)return;
      const portrait=h>w*1.08;
      stage.classList.toggle('lh-video-portrait',portrait);
      stage.classList.toggle('lh-video-landscape',!portrait);
    };
    video.addEventListener('loadedmetadata',fit);video.addEventListener('loadeddata',fit);video.addEventListener('resize',fit);video.addEventListener('emptied',clear);
    viewer?.addEventListener('close',clear);fit();
  }
'''
          new = r'''  function installPortraitFit() {
    const video=$('#videoPlayer'),stage=$('#viewerStage'),viewer=$('#viewer'),pathNode=$('#viewerPath');
    if(!video||!stage||!viewer)return;
    let probeToken=0,authoritativePath='';
    const clear=()=>{
      probeToken++;authoritativePath='';
      stage.classList.remove('lh-video-portrait','lh-video-landscape');
      viewer.classList.remove('lh-player-portrait','lh-player-landscape');
      stage.style.removeProperty('--lh-media-aspect');
    };
    const apply=(width,height,authoritative=false)=>{
      let w=Number(width)||0,h=Number(height)||0;
      if(!w||!h)return;
      const portrait=h>w*1.08;
      stage.classList.toggle('lh-video-portrait',portrait);
      stage.classList.toggle('lh-video-landscape',!portrait);
      viewer.classList.toggle('lh-player-portrait',portrait);
      viewer.classList.toggle('lh-player-landscape',!portrait);
      stage.style.setProperty('--lh-media-aspect',`${w}/${h}`);
      if(authoritative)authoritativePath=currentPath();
    };
    const fitIntrinsic=()=>{
      const path=currentPath();
      if(path&&authoritativePath===path)return;
      apply(video.videoWidth,video.videoHeight,false);
    };
    const fitProbe=async()=>{
      const path=currentPath();if(!path)return;
      const token=++probeToken;
      try{
        const data=await api(`/api/media/probe?path=${encodeURIComponent(path)}`);
        if(token!==probeToken||!viewer.open||currentPath()!==path)return;
        const p=data.probe||{};
        const w=Number(p.displayWidth||p.width)||0,h=Number(p.displayHeight||p.height)||0;
        if(w&&h)apply(w,h,true);
      }catch{}
    };
    video.addEventListener('loadedmetadata',()=>{fitIntrinsic();requestAnimationFrame(fitIntrinsic);fitProbe();});
    video.addEventListener('loadeddata',fitIntrinsic);
    video.addEventListener('resize',fitIntrinsic);
    video.addEventListener('emptied',clear);
    viewer.addEventListener('close',clear);
    if(pathNode)new MutationObserver(()=>{authoritativePath='';fitProbe();}).observe(pathNode,{subtree:true,childList:true,characterData:true});
    fitIntrinsic();fitProbe();
  }
'''
          if old not in js:
              raise SystemExit('installPortraitFit block not found')
          js = js.replace(old, new, 1)
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('ux_enhancements.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Portrait fit is deliberately metadata-only: no probe request and no observer chain. */'
          if marker not in css:
              raise SystemExit('portrait css marker not found')
          start = css.index(marker)
          end = css.index('\n\n/* The old tag modal', start)
          replacement = '''/* Portrait mode uses one cached LocalHub media probe as the authoritative orientation.\n   This handles files where Chromium intrinsic dimensions disagree with the container metadata. */\n.viewer-stage{contain:layout paint}\n.viewer-stage video{display:block;object-fit:contain!important;object-position:center center!important;max-width:100%!important;max-height:100%!important}\n.viewer-stage.lh-video-portrait video{width:auto!important;height:100%!important;max-width:100%!important;max-height:100%!important}\n.viewer-stage.lh-video-landscape video{width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important}\n.viewer.lh-player-portrait{width:min(720px,94vw);height:min(96vh,1040px)}\n.viewer.lh-player-portrait .player-shell{height:calc(100% - 164px)}\n.viewer.lh-player-portrait .viewer-stage{min-height:0}\n@media(max-width:760px){.viewer.lh-player-portrait{width:100vw;max-width:100vw;height:100vh;max-height:100vh;border-radius:0}.viewer.lh-player-portrait .player-shell{height:calc(100% - 160px)}.viewer-stage.lh-video-portrait video{width:auto!important;height:100%!important}}'''
          css = css[:start] + replacement + css[end:]
          css_path.write_text(css, encoding='utf-8')

          Path('.github/workflows/alpha4-1-portrait-patch.yml').unlink()
      - name: Validate frontend
        run: node --check ux_enhancements.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ux_enhancements.js ux_enhancements.css .github/workflows/alpha4-1-portrait-patch.yml
          git commit -m "fix: make media probe authoritative for portrait layout"
          git push origin HEAD:agent/2.2.4-alpha4.1-portrait-probe
