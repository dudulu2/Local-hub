name: Fix taxonomy group names

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assistant-fix-taxonomy-group-names.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tray-lifecycle-2.4.1
          fetch-depth: 0
      - name: Restore product-facing group names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ai_taxonomy_v2.py')
          text = path.read_text('utf-8')
          old = '"id": "adult",\n        "name": "成人内容"'
          new = '"id": "adult",\n        "name": "色情"'
          if old not in text:
              raise SystemExit('missing adult taxonomy anchor')
          path.write_text(text.replace(old, new, 1), 'utf-8')
          PY
          python -m py_compile ai_taxonomy_v2.py ai_settings_support.py ai_tag_sync_support.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_taxonomy_v2.py
          git commit -m 'fix: preserve adult Tag group display name'
          git push origin HEAD:fix/tray-lifecycle-2.4.1
