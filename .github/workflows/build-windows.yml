name: Native Player Windows validation

on:
  pull_request:
    branches: [ci/2.3-alpha1-native-build-base]

permissions:
  contents: read

jobs:
  validate-native-player:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller pystray pillow imageio-ffmpeg comtypes pywebview==6.2.1 pythonnet clr-loader

      - name: Download LGPL libmpv runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\vendor | Out-Null
          New-Item -ItemType Directory -Force .\_mpv | Out-Null
          $headers = @{ 'User-Agent' = 'LocalHub-CI' }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -like 'mpv-dev-lgpl-x86_64-*.7z' -and $_.name -notlike '*-v3-*' } | Select-Object -First 1
          if (-not $asset) { throw 'No mpv-dev-lgpl-x86_64 release asset found' }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile .\_mpv\mpv.7z
          $archive = (Resolve-Path .\_mpv\mpv.7z).Path
          $out = (Resolve-Path .\_mpv).Path + '\expanded'
          & 7z.exe x $archive "-o$out" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed: $LASTEXITCODE" }
          $dll = Get-ChildItem $out -Recurse -File | Where-Object { $_.Name -in @('libmpv-2.dll','mpv-2.dll') } | Select-Object -First 1
          if (-not $dll) { throw 'libmpv DLL not found in archive' }
          Copy-Item $dll.FullName .\vendor\libmpv-2.dll -Force
          $hash = (Get-FileHash .\vendor\libmpv-2.dll -Algorithm SHA256).Hash.ToLower()
          "asset=$($asset.name)" | Set-Content .\vendor\LIBMPV_BUILD.txt -Encoding utf8
          "url=$($asset.browser_download_url)" | Add-Content .\vendor\LIBMPV_BUILD.txt -Encoding utf8
          "sha256=$hash" | Add-Content .\vendor\LIBMPV_BUILD.txt -Encoding utf8
          Write-Host "libmpv SHA256: $hash"

      - name: Validate sources
        shell: pwsh
        run: |
          python -m py_compile launcher.py launcher_native.py native_player.py server.py smart_mode.py smart_thumbnail.py preview_support.py playback_priority.py io_scheduler.py media_probe.py compat_support.py rating_support.py recommendation_support.py catalog_cache.py tools/smoke_native_player.py tools/smoke_move.py tools/smoke_recommendations.py tools/smoke_exact_fit.py tools/smoke_playback_priority.py tools/smoke_compat.py tools/smoke_preview.py tools/smoke_launcher.py
          node --check .\smart_ui.js
          node --check .\ux_enhancements.js
          node --check .\move_branding.js
          node --check .\recommendation_ui.js
          node --check .\native_player_ui.js

      - name: Native libmpv smoke test
        shell: pwsh
        run: |
          $env:LOCALHUB_LIBMPV_DLL = (Resolve-Path .\vendor\libmpv-2.dll).Path
          python tools/smoke_native_player.py

      - name: Move and navigation smoke test
        run: python tools/smoke_move.py

      - name: Recommendation isolation smoke test
        run: python tools/smoke_recommendations.py

      - name: Unified exact-fit smoke test
        run: python tools/smoke_exact_fit.py

      - name: Playback priority smoke test
        run: python tools/smoke_playback_priority.py

      - name: Media compatibility regression smoke test
        run: python tools/smoke_compat.py

      - name: Preview smoke test
        run: python tools/smoke_preview.py

      - name: Launcher backend smoke test
        run: python tools/smoke_launcher.py

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Build one-file executable
        run: pyinstaller --noconfirm --clean LocalHub.spec

      - name: Packaged EXE native self-test
        shell: pwsh
        run: |
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:ALL_PROXY = 'http://127.0.0.1:9'
          $env:NO_PROXY = ''
          $p = Start-Process -FilePath .\dist\LocalHub.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged LocalHub native self-test failed: $($p.ExitCode)" }

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\LocalHub.exe -Algorithm SHA256).Hash.ToLower()
          "LocalHub.exe  $hash" | Set-Content .\dist\SHA256.txt -Encoding utf8
          Copy-Item .\THIRD_PARTY_NOTICES.md .\dist\THIRD_PARTY_NOTICES.md
          Copy-Item .\vendor\LIBMPV_BUILD.txt .\dist\LIBMPV_BUILD.txt
          Write-Host "SHA256: $hash"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: LocalHub-Windows-x64
          path: |
            dist/LocalHub.exe
            dist/SHA256.txt
            dist/THIRD_PARTY_NOTICES.md
            dist/LIBMPV_BUILD.txt
          if-no-files-found: error
          compression-level: 0
