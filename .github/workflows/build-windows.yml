name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'launcher.py'
      - 'server.py'
      - 'smart_mode.py'
      - 'smart_thumbnail.py'
      - 'preview_support.py'
      - 'interactive_preview_support.py'
      - 'playback_stability.*'
      - 'media_probe.py'
      - 'compat_support.py'
      - 'rating_support.py'
      - 'recommendation_support.py'
      - 'catalog_cache.py'
      - 'io_*.py'
      - 'visual_*.py'
      - 'auto_tag_*.py'
      - 'auto_tag_ui.*'
      - 'siglip_*.py'
      - 'smart_index.html'
      - 'smart_ui.css'
      - 'smart_ui.js'
      - 'ux_enhancements.css'
      - 'ux_enhancements.js'
      - 'move_branding.js'
      - 'v23_features.css'
      - 'v23_features.js'
      - 'v23_player_fix.css'
      - 'v23_player_fix.js'
      - 'LocalHub.spec'
      - 'version_info.txt'
      - 'VERSION'
      - 'README.md'
      - 'README_EN.md'
      - 'RELEASE_NOTES.md'
      - 'tools/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'launcher.py'
      - 'server.py'
      - 'smart_mode.py'
      - 'smart_thumbnail.py'
      - 'preview_support.py'
      - 'interactive_preview_support.py'
      - 'playback_stability.*'
      - 'media_probe.py'
      - 'compat_support.py'
      - 'rating_support.py'
      - 'recommendation_support.py'
      - 'catalog_cache.py'
      - 'io_*.py'
      - 'visual_*.py'
      - 'auto_tag_*.py'
      - 'auto_tag_ui.*'
      - 'siglip_*.py'
      - 'smart_index.html'
      - 'smart_ui.css'
      - 'smart_ui.js'
      - 'ux_enhancements.css'
      - 'ux_enhancements.js'
      - 'move_branding.js'
      - 'v23_features.css'
      - 'v23_features.js'
      - 'v23_player_fix.css'
      - 'v23_player_fix.js'
      - 'LocalHub.spec'
      - 'version_info.txt'
      - 'VERSION'
      - 'README.md'
      - 'README_EN.md'
      - 'RELEASE_NOTES.md'
      - 'tools/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller pystray pillow imageio-ffmpeg comtypes numpy onnxruntime sentencepiece

      - name: Validate Python
        run: python -m py_compile launcher.py server.py smart_mode.py smart_thumbnail.py preview_support.py interactive_preview_support.py media_probe.py compat_support.py rating_support.py recommendation_support.py catalog_cache.py io_scheduler.py io_support.py visual_encoder.py visual_index.py auto_tag_prompts.py auto_tag_support.py siglip_encoder.py siglip_support.py tools/smoke_smart.py tools/smoke_preview.py tools/smoke_compat.py tools/smoke_metadata.py tools/smoke_launcher.py tools/smoke_recommend.py tools/smoke_frontend_guard.py tools/smoke_browser.py tools/smoke_auto_tag.py tools/smoke_siglip_online.py tools/smoke_playback_stability.py tools/build_ai_bundle.py

      - name: Validate frontend JavaScript
        shell: pwsh
        run: |
          node --check .\smart_ui.js
          node --check .\ux_enhancements.js
          node --check .\move_branding.js
          node --check .\v23_features.js
          node --check .\v23_player_fix.js
          node --check .\auto_tag_ui.js
          node --check .\playback_stability.js

      - name: Frontend observer loop smoke test
        run: python tools/smoke_frontend_guard.py

      - name: Playback stability smoke test
        run: python tools/smoke_playback_stability.py

      - name: Launcher startup smoke test
        run: python tools/smoke_launcher.py

      - name: Real Edge homepage smoke test
        run: python tools/smoke_browser.py

      - name: Auto Tag low-risk smoke test
        run: python tools/smoke_auto_tag.py

      - name: Verify real SigLIP INT8 ONNX
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'ci/siglip-model')
        timeout-minutes: 12
        run: python tools/smoke_siglip_online.py

      - name: Smart catalog smoke test
        run: python tools/smoke_smart.py

      - name: Preview extraction smoke test
        run: python tools/smoke_preview.py

      - name: Media compatibility smoke test
        run: python tools/smoke_compat.py

      - name: Metadata UX smoke test
        run: python tools/smoke_metadata.py

      - name: Recommendation performance smoke test
        run: python tools/smoke_recommend.py

      - name: Generate application icon
        run: python tools/make_icon.py

      - name: Build one-file executable
        run: pyinstaller --noconfirm --clean LocalHub.spec

      - name: Execute packaged EXE self-test behind hostile proxy
        shell: pwsh
        run: |
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:ALL_PROXY = 'http://127.0.0.1:9'
          $env:NO_PROXY = ''
          $p = Start-Process -FilePath .\dist\LocalHub.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $log = '.\dist\.localhub\startup-error.log'
            if (Test-Path $log) { Write-Host '--- packaged self-test traceback ---'; Get-Content $log }
            throw "Packaged LocalHub proxy-isolation self-test failed with exit code $($p.ExitCode)"
          }
          Write-Host "Packaged LocalHub proxy-isolation self-test passed"

      - name: Build LocalHub with AI package
        if: github.event_name != 'pull_request' || github.head_ref == 'feature/localhub-with-ai-package'
        timeout-minutes: 15
        run: python tools/build_ai_bundle.py --exe dist/LocalHub.exe --output-dir dist

      - name: Generate SHA256
        shell: pwsh
        run: |
          $rows = @()
          $hash = (Get-FileHash .\dist\LocalHub.exe -Algorithm SHA256).Hash.ToLower()
          $rows += "LocalHub.exe  $hash"
          if (Test-Path .\dist\LocalHub-with-AI.zip) {
            $aiHash = (Get-FileHash .\dist\LocalHub-with-AI.zip -Algorithm SHA256).Hash.ToLower()
            $rows += "LocalHub-with-AI.zip  $aiHash"
          }
          $rows | Set-Content .\dist\SHA256.txt -Encoding utf8
          $rows | ForEach-Object { Write-Host $_ }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: LocalHub-Windows-x64
          path: |
            dist/LocalHub.exe
            dist/SHA256.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload LocalHub with AI package
        if: github.event_name != 'pull_request' || github.head_ref == 'feature/localhub-with-ai-package'
        uses: actions/upload-artifact@v4
        with:
          name: LocalHub-with-AI-Windows-x64
          path: dist/LocalHub-with-AI.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publish stable release from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          if (-not $version) { throw 'VERSION is empty' }
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag .\dist\LocalHub.exe .\dist\LocalHub-with-AI.zip .\dist\SHA256.txt --clobber
            gh release edit $tag --notes-file .\RELEASE_NOTES.md
          } else {
            gh release create $tag .\dist\LocalHub.exe .\dist\LocalHub-with-AI.zip .\dist\SHA256.txt --target "${{ github.sha }}" --title "LocalHub $version" --notes-file .\RELEASE_NOTES.md
          }

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag .\dist\LocalHub.exe .\dist\LocalHub-with-AI.zip .\dist\SHA256.txt --clobber
          } else {
            gh release create $tag .\dist\LocalHub.exe .\dist\LocalHub-with-AI.zip .\dist\SHA256.txt --title "LocalHub $tag" --generate-notes
          }
