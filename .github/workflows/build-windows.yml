name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'launcher.py'
      - 'server.py'
      - 'smart_mode.py'
      - 'smart_thumbnail.py'
      - 'preview_support.py'
      - 'media_probe.py'
      - 'compat_support.py'
      - 'rating_support.py'
      - 'catalog_cache.py'
      - 'smart_index.html'
      - 'smart_ui.css'
      - 'smart_ui.js'
      - 'ux_enhancements.css'
      - 'ux_enhancements.js'
      - 'move_branding.js'
      - 'LocalHub.spec'
      - 'version_info.txt'
      - 'VERSION'
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'tools/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main, 'ci/2.2.4-alpha1-build-base']
    paths:
      - 'launcher.py'
      - 'server.py'
      - 'smart_mode.py'
      - 'smart_thumbnail.py'
      - 'preview_support.py'
      - 'media_probe.py'
      - 'compat_support.py'
      - 'rating_support.py'
      - 'catalog_cache.py'
      - 'smart_index.html'
      - 'smart_ui.css'
      - 'smart_ui.js'
      - 'ux_enhancements.css'
      - 'ux_enhancements.js'
      - 'move_branding.js'
      - 'LocalHub.spec'
      - 'version_info.txt'
      - 'VERSION'
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - 'tools/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller pystray pillow imageio-ffmpeg comtypes

      - name: Validate Python
        run: python -m py_compile launcher.py server.py smart_mode.py smart_thumbnail.py preview_support.py media_probe.py compat_support.py rating_support.py catalog_cache.py tools/smoke_smart.py tools/smoke_preview.py tools/smoke_compat.py tools/smoke_metadata.py tools/smoke_launcher.py

      - name: Validate frontend JavaScript
        shell: pwsh
        run: |
          node --check .\smart_ui.js
          node --check .\ux_enhancements.js
          node --check .\move_branding.js

      - name: Launcher startup smoke test
        run: python tools/smoke_launcher.py

      - name: Smart catalog smoke test
        run: python tools/smoke_smart.py

      - name: Preview extraction smoke test
        run: python tools/smoke_preview.py

      - name: Media compatibility smoke test
        run: python tools/smoke_compat.py

      - name: Metadata UX smoke test
        run: python tools/smoke_metadata.py

      - name: Generate application icon
        run: python tools/make_icon.py

      - name: Build one-file executable
        run: pyinstaller --noconfirm --clean LocalHub.spec

      - name: Execute packaged EXE self-test behind hostile proxy
        shell: pwsh
        run: |
          $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $env:ALL_PROXY = 'http://127.0.0.1:9'
          $env:NO_PROXY = ''
          $p = Start-Process -FilePath .\dist\LocalHub.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged LocalHub proxy-isolation self-test failed with exit code $($p.ExitCode)" }
          Write-Host "Packaged LocalHub proxy-isolation self-test passed"

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\LocalHub.exe -Algorithm SHA256).Hash.ToLower()
          "LocalHub.exe  $hash" | Set-Content .\dist\SHA256.txt -Encoding utf8
          Write-Host "SHA256: $hash"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: LocalHub-Windows-x64
          path: |
            dist/LocalHub.exe
            dist/SHA256.txt
          if-no-files-found: error
          compression-level: 0

      - name: Publish stable release from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          if (-not $version) { throw 'VERSION is empty' }
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag .\dist\LocalHub.exe .\dist\SHA256.txt --clobber
          } else {
            gh release create $tag .\dist\LocalHub.exe .\dist\SHA256.txt --target "${{ github.sha }}" --title "LocalHub $version" --notes-file .\RELEASE_NOTES.md
          }

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag .\dist\LocalHub.exe .\dist\SHA256.txt --clobber
          } else {
            gh release create $tag .\dist\LocalHub.exe .\dist\SHA256.txt --title "LocalHub $tag" --generate-notes
          }
