name: Apply alpha5 recommendation wiring

on:
  push:
    branches: [agent/2.2.4-alpha5-recommendations]
    paths: ['.github/workflows/alpha5-apply.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/2.2.4-alpha5-recommendations
      - name: Wire recommendation module without touching player flow
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'anchor not found: {label}')
              return text.replace(old, new, 1)

          p = Path('launcher.py')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              '    import rating_support\n',
              '    import rating_support\n    import recommendation_support\n',
              'launcher import')
          s = replace_once(s,
              '    server.STATIC_FILES["/move_branding.js"] = app_dir / "move_branding.js"\n',
              '    server.STATIC_FILES["/move_branding.js"] = app_dir / "move_branding.js"\n    server.STATIC_FILES["/recommendation_ui.js"] = app_dir / "recommendation_ui.js"\n',
              'static registration')
          s = replace_once(s,
              '    compat_support.install(server)\n    cleanup_compat_cache(root)\n',
              '    compat_support.install(server)\n    recommendation_support.install(server, smart_mode)\n    cleanup_compat_cache(root)\n',
              'recommend install')
          s = replace_once(s,
              '        import compat_support\n        if not callable(getattr(compat_support, "install", None)):\n            return 11\n',
              '        import compat_support\n        import recommendation_support\n        if not callable(getattr(compat_support, "install", None)):\n            return 11\n        if not callable(getattr(recommendation_support, "install", None)):\n            return 12\n',
              'self test import')
          s = replace_once(s,
              '("smart_index.html", "smart_ui.css", "smart_ui.js", "ux_enhancements.css", "ux_enhancements.js", "move_branding.js")',
              '("smart_index.html", "smart_ui.css", "smart_ui.js", "ux_enhancements.css", "ux_enhancements.js", "move_branding.js", "recommendation_ui.js")',
              'self test assets')
          p.write_text(s, encoding='utf-8')

          p = Path('smart_index.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              '  <script src="/move_branding.js"></script>\n',
              '  <script src="/move_branding.js"></script>\n  <script src="/recommendation_ui.js"></script>\n',
              'html recommendation script')
          p.write_text(s, encoding='utf-8')

          p = Path('smart_ui.js')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              "  loadHome().catch(e=>{el.meta.textContent='索引加载失败';toast(e.message);});\n})();\n",
              "  // Narrow public bridge used only by the optional recommendation strip.\n  // It reuses the exact stable openViewer path instead of duplicating player logic.\n  window.LocalHubOpenVideo = openViewer;\n\n  loadHome().catch(e=>{el.meta.textContent='索引加载失败';toast(e.message);});\n})();\n",
              'smart ui bridge')
          p.write_text(s, encoding='utf-8')

          p = Path('LocalHub.spec')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              "        ('move_branding.js', '.'),\n",
              "        ('move_branding.js', '.'),\n        ('recommendation_ui.js', '.'),\n",
              'pyinstaller recommendation asset')
          p.write_text(s, encoding='utf-8')

          p = Path('.github/workflows/build-windows.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace("      - 'rating_support.py'\n", "      - 'rating_support.py'\n      - 'recommendation_support.py'\n")
          s = s.replace("      - 'move_branding.js'\n", "      - 'move_branding.js'\n      - 'recommendation_ui.js'\n")
          s = replace_once(s,
              'tools/smoke_metadata.py tools/smoke_launcher.py',
              'tools/smoke_metadata.py tools/smoke_launcher.py tools/smoke_recommendations.py recommendation_support.py',
              'python validation')
          s = replace_once(s,
              '          node --check .\\move_branding.js\n',
              '          node --check .\\move_branding.js\n          node --check .\\recommendation_ui.js\n',
              'javascript validation')
          anchor = '      - name: Metadata UX smoke test\n        run: python tools/smoke_metadata.py\n'
          addition = anchor + '\n      - name: Recommendation isolation smoke test\n        run: python tools/smoke_recommendations.py\n'
          s = replace_once(s, anchor, addition, 'recommend smoke')
          p.write_text(s, encoding='utf-8')

          Path('.github/workflows/alpha5-apply.yml').unlink()
      - name: Validate patched sources
        run: |
          python -m py_compile recommendation_support.py tools/smoke_recommendations.py launcher.py
          node --check smart_ui.js
          node --check recommendation_ui.js
          python tools/smoke_recommendations.py
      - name: Commit alpha5 wiring
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add launcher.py smart_index.html smart_ui.js LocalHub.spec .github/workflows/build-windows.yml .github/workflows/alpha5-apply.yml
          git commit -m "feat: wire isolated recommendation strip"
          git push origin HEAD:agent/2.2.4-alpha5-recommendations
