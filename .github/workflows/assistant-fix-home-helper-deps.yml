name: Fix home pagination helper dependencies

on:
  push:
    branches: [fix/tray-lifecycle-2.4.1]
    paths:
      - '.github/workflows/assistant-fix-home-helper-deps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tray-lifecycle-2.4.1
          fetch-depth: 0
      - name: Add helper test dependencies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/assistant-home-pagination-ai-sync.yml')
          text = path.read_text('utf-8')
          anchor = "      - name: Apply product UX patches\n"
          block = "      - name: Install helper test dependencies\n        run: python -m pip install pillow imageio-ffmpeg numpy onnxruntime sentencepiece\n"
          if block not in text:
              if anchor not in text:
                  raise SystemExit('helper anchor missing')
              text = text.replace(anchor, block + anchor, 1)
              path.write_text(text, 'utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/assistant-home-pagination-ai-sync.yml
          if git diff --cached --quiet; then
            echo 'Helper already has dependencies'
          else
            git commit -m 'build: install dependencies for home pagination helper'
            git push origin HEAD:fix/tray-lifecycle-2.4.1
          fi
